# ============================================================================
# Booksync -- GitHub Actions workflow (fork item F10)
# ============================================================================
# Replaces upstream's docker-publish, go, helm-publish and trivy workflows.
# Shaped like PB's own images (Spooder): a push to main builds and pushes
# ghcr.io/the-alphabet-cartel/booksync:latest, which Diun's cluster default
# (INCLUDETAGS=latest) watches. Pull requests test and build, never push.
#
# Deliberately NO tag triggers: upstream's v* tags must never publish
# anything from this fork.
#
# amd64 only: booksync runs pinned to Lofn (SQLite on a Lofn hostPath).
#
# Required secrets: none beyond the automatic GITHUB_TOKEN.
# ============================================================================

name: Build and Push Booksync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/the-alphabet-cartel/booksync

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go tests (race detector, as make test runs them)
        run: make test

      - name: Dashboard JS tests
        run: >
          docker run --rm -v "$PWD:/src" -w /src node:22-alpine
          node --test web/app.test.js web/abs_link.test.js

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
